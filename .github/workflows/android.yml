# ملاحظة: هذا الملف يُنشئ APK و AAB تلقائيًا في السحابة — لا تحتاج لتشغيل Godot على جهازك.
name: بناء أندرويد (APK + AAB)

on:
  workflow_dispatch:
    inputs:
      makerelease:
        description: "إنشاء Release على GitHub؟ (yes/no)"
        required: false
        default: "yes"
  push:
    tags:
      - "v*"

permissions:
  contents: write   # لنشر الـRelease ورفع الأرتيفاكت
  issues: write     # لقناة التشخيص (نرسل سجل البناء إلى Issue عند الفشل)

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    timeout-minutes: 75
    env:
      BUILD_LOG: /tmp/m11-build.log
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
      GODOT: godot
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: جلب الشيفرة
        uses: actions/checkout@v4

      - name: تحضير مجلد إعدادات Godot
        run: |
          set -e
          mkdir -pv ~/.config
          [ -d /root/.config/godot ] && cp -rv /root/.config/godot ~/.config/ || true
          echo "=== بدء سجل البناء ===" >> "$BUILD_LOG"
          godot --version | tee -a "$BUILD_LOG" || true
          java -version 2>&1 | tee -a "$BUILD_LOG" || true

      - name: استيراد المشروع (بناء ذاكرة الأصول)
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 900 godot --headless --path project --import --quit 2>&1 | tee -a "$BUILD_LOG" || true

      - name: تثبيت قالب بناء أندرويد (Gradle)
        continue-on-error: true
        run: |
          set -o pipefail
          # --quit ضرورية: بدونها يبقى Godot يعمل بلا نهاية بعد تثبيت القالب
          timeout 600 godot --headless --path project --install-android-build-template --quit 2>&1 | tee -a "$BUILD_LOG" \
            || echo "::warning::تعذّر تثبيت قالب البناء — سنجرّب مسار التصدير المباشر"
          ls project/android/build 2>/dev/null | head 2>&1 | tee -a "$BUILD_LOG" || true

      - name: توليد مفتاح توقيع الإصدار
        continue-on-error: true
        run: |
          set -e
          KEYTOOL="$(command -v keytool || true)"
          if [ -z "$KEYTOOL" ]; then
            KEYTOOL="$(ls -1 /usr/lib/jvm/*/bin/keytool 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$KEYTOOL" ]; then
            echo "::warning::لا توجد أداة keytool — نستخدم مفتاح التصحيح المدمج في الصورة"
          else
            "$KEYTOOL" -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/release.keystore" \
              -alias m11 -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass m11localwar -keypass m11localwar \
              -dname "CN=M11 Local War, OU=Games, O=M11-Developer, L=Cairo, C=EG" 2>&1 | tee -a "$BUILD_LOG"
          fi
          if [ -f "$GITHUB_WORKSPACE/release.keystore" ]; then
            python3 tools/patch_presets.py "$GITHUB_WORKSPACE/release.keystore" m11 m11localwar 2>&1 | tee -a "$BUILD_LOG"
          elif [ -f /root/debug.keystore ]; then
            python3 tools/patch_presets.py /root/debug.keystore androiddebugkey android 2>&1 | tee -a "$BUILD_LOG"
          fi

      - name: تصدير نسخة التصحيح (APK يُثبّت مباشرة)
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p build
          set +e
          timeout 1800 godot --headless --verbose --path project --export-debug "Android APK" "$GITHUB_WORKSPACE/build/M11-debug.apk" 2>&1 | tee -a "$BUILD_LOG"
          if [ ! -f build/M11-debug.apk ]; then
            echo "::warning::فشل مسار Gradle — نعيد بقالب التصدير المباشر (بلا Gradle)"
            sed -i 's|gradle_build/use_gradle_build=true|gradle_build/use_gradle_build=false|g' project/export_presets.cfg
            timeout 1800 godot --headless --verbose --path project --export-debug "Android APK" "$GITHUB_WORKSPACE/build/M11-debug.apk" 2>&1 | tee -a "$BUILD_LOG"
          fi
          ls -la build 2>&1 | tee -a "$BUILD_LOG"

      - name: تصدير نسخة الإصدار (APK + AAB)
        continue-on-error: true
        run: |
          set +e
          timeout 1800 godot --headless --verbose --path project --export-release "Android APK" "$GITHUB_WORKSPACE/build/M11-release.apk" 2>&1 | tee -a "$BUILD_LOG"
          timeout 1800 godot --headless --verbose --path project --export-release "Android AAB" "$GITHUB_WORKSPACE/build/M11-release.aab" 2>&1 | tee -a "$BUILD_LOG"
          ls -la build 2>&1 | tee -a "$BUILD_LOG"
          if [ ! -f build/M11-debug.apk ] && [ ! -f build/M11-release.apk ]; then
            echo "::error::لم يُنتج أي ملف APK — راجع قناة التشخيص (Issue)"
            exit 1
          fi

      - name: التحقق من الملفات الناتجة
        run: |
          set -e
          for f in build/M11-debug.apk build/M11-release.apk build/M11-release.aab; do
            if [ -f "$f" ]; then echo "✔ $f — $(du -h "$f" | cut -f1)"; else echo "✘ مفقود: $f"; fi
          done
          for f in build/M11-debug.apk build/M11-release.apk; do
            if [ -s "$f" ]; then python3 tools/check_apk.py "$f" 2>&1 | tee -a "$BUILD_LOG" || true; fi
          done
          echo ok > /tmp/m11-status
          true

      - name: الحصاد النهائي (هل أُنتج ملف قابل للتثبيت؟)
        id: gate
        run: |
          set -e
          ok=0
          for f in build/M11-debug.apk build/M11-release.apk; do
            if [ -s "$f" ]; then echo "✔ $f — $(du -h "$f" | cut -f1)"; ok=1; fi
          done
          if [ "$ok" = "0" ]; then
            echo "::error::لم يُنتج أي APK — راجع قناة التشخيص"
            exit 1
          fi

      - name: رفع الملفات كأرتيفاكت
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M11-android
          if-no-files-found: warn
          path: |
            build/*.apk
            build/*.aab
            docs/RELEASE_NOTES_AR.md
            /tmp/m11-build.log

      - name: إنشاء Release (إن طُلب)
        if: success() && (startsWith(github.ref, 'refs/tags/v') || inputs.makerelease == 'yes')
        uses: softprops/action-gh-release@v2
        with:
          name: "ميكا ١١ —الإصدار ١٫٠ (LAN)"
          body_path: docs/RELEASE_NOTES_AR.md
          generate_release_notes: false
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            build/M11-debug.apk
            build/M11-release.apk
            build/M11-release.aab

      # ---------- قناة التشخيص: تصلح لأن سجلات Actions قد لا تكون مقروءة للأدوات ----------
      # عند الفشل نرسل آخر 60 ألف حرف من سجل البناء إلى Issue حتى نعرف السبب بدقة.
      - name: نشر سجل البناء للتشخيص
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request

          log_path = os.environ.get("BUILD_LOG", "/tmp/m11-build.log")
          try:
              text = open(log_path, encoding="utf-8", errors="replace").read()
          except FileNotFoundError:
              text = "(لا يوجد سجل)"
          tail = text[-60000:]
          try:
              state = "نجح ✔" if open("/tmp/m11-status").read().strip() == "ok" else "فشل ✘"
          except FileNotFoundError:
              state = "فشل ✘ (توقّف قبل خطوة التحقق)"
          title = f"سجل بناء أندرويد — {os.environ.get('GITHUB_REF_NAME','?')}"
          body = f"**الحالة:** {state} | العملية: {os.environ.get('GITHUB_RUN_ID')}\n\n```\n{tail}\n```"
          token = os.environ.get("GH_TOKEN") or os.environ.get("GITHUB_TOKEN") or ""
          if not token:
              print("لا يوجد رمز — تخطّي التشخيص")
              raise SystemExit(0)
          api = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
          hdr = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json",
                 "Content-Type": "application/json", "User-Agent": "m11-ci"}
          # نبحث عن Issue سابق بنفس العنوان لنعلّق عليه بدل فتح واحد جديد كل مرة
          try:
              req = urllib.request.Request(api + "/issues?state=open&per_page=50", headers=hdr)
              issues = json.load(urllib.request.urlopen(req))
          except Exception as exc:
              print("تعذّر قراءة القضايا:", exc)
              raise SystemExit(0)
          found = next((i for i in issues if i.get("title") == title), None)
          if found:
              url = found["comments_url"]
          else:
              req = urllib.request.Request(api + "/issues",
                                           data=json.dumps({"title": title, "body": "قناة تشخيص آلية لبناء أندرويد."}).encode(),
                                           headers=hdr)
              url = json.load(urllib.request.urlopen(req))["comments_url"]
          req = urllib.request.Request(url, data=json.dumps({"body": body}).encode(), headers=hdr)
          urllib.request.urlopen(req)
          print("✔ نُشر سجل البناء في قناة التشخيص")
          PYEOF
