# ملاحظة: هذا الملف يبني APK و AAB تلقائيًا في السحابة — لا حاجة لتشغيل Godot على جهازك.
# القناة التشخيصية: عند أي فشل يُرسل آخر جزء من سجل البناء إلى Issue بعنوان
# "M11 build <رقم التشغيل>" حتى نعرف السبب بدقة من دون قراءة سجلات Actions المحجوبة.
name: بناء أندرويد (APK + AAB)

on:
  workflow_dispatch:
    inputs:
      makerelease:
        description: "إنشاء Release على GitHub؟ (yes/no)"
        required: false
        default: "yes"
  push:
    tags:
      - "v1.*"    # نسخة Godot الأصلية (نسخة الويب لها وسم web-*)

permissions:
  contents: write   # لنشر الـRelease ورفع الأرتيفاكت
  issues: write     # لقناة التشخيص

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    timeout-minutes: 75
    env:
      BUILD_LOG: /tmp/m11-build.log
      GH_TOKEN: ${{ github.token }}
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      # Godot 4.3 يقرأ بيانات مفتاح الإصدار من متغيّرات البيئة أيضًا (احتياط ثانٍ)
      GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /github/workspace/release.keystore
      GODOT_ANDROID_KEYSTORE_RELEASE_USER: m11
      GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: m11localwar
    steps:
      - name: جلب الشيفرة
        uses: actions/checkout@v4

      - name: تشخيص البيئة وفتح قناة التشخيص
        if: always()
        run: |
          set +e
          {
            echo "== معلومات البيئة =="
            echo "ref=$GITHUB_REF_NAME run=$GITHUB_RUN_ID"
            echo "godot=$(godot --version 2>&1 | head -2)"
            echo "python3=$(command -v python3 || echo MISSING)"
            echo "curl=$(command -v curl || echo MISSING)"
            echo "unzip=$(command -v unzip || echo MISSING)"
            echo "java=$(java -version 2>&1 | head -1)"
            echo "keytool=$(command -v keytool || ls -1 /usr/lib/jvm/*/bin/keytool 2>/dev/null | head -1 || echo MISSING)"
            echo "templates=$(ls -1 ~/.local/share/godot/export_templates 2>/dev/null | tr '\n' ' ')"
            echo "sdk=$(ls -d /usr/lib/android-sdk 2>/dev/null || echo MISSING)"
          } > /tmp/env.txt 2>&1
          cat /tmp/env.txt
          cp /tmp/env.txt "$BUILD_LOG"
          INFO=$(base64 -w0 < /tmp/env.txt)
          printf '{"title":"M11 build %s","body":"### env\\n```\\n%s\\n```"}' "$GITHUB_RUN_ID" "$INFO" > /tmp/issue.json
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "User-Agent: m11-ci" --data @/tmp/issue.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" > /tmp/issue_resp.json 2>&1
          grep -o '"number":[0-9]*' /tmp/issue_resp.json | head -1 | cut -d: -f2 > /tmp/issue_number
          echo "issue=$(cat /tmp/issue_number)"

      - name: تحضير إعدادات Godot للمحرّر (جافا + SDK + مفتاح التصحيح)
        continue-on-error: true
        run: |
          set +e
          mkdir -pv ~/.config
          # صورة godot-ci تبني إعداداتها تحت /root بينما تشغيل Actions يستخدم
          # /github/home — فننسخ الإعدادات ونُكمل الناقص (مسار جافا و SDK والمفتاح)،
          # وإلا يرفض Godot التصدير برسالة «configuration errors».
          [ -d /root/.config/godot ] && cp -rn /root/.config/godot ~/.config/ 2>/dev/null
          JAVA_DIR="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          if [ ! -x "$JAVA_DIR/bin/java" ]; then
            JAVA_DIR="$(for d in /usr/lib/jvm/*/; do [ -x "$d/bin/javac" ] && echo "${d%/}" && break; done)"
          fi
          if [ ! -x "$JAVA_DIR/bin/java" ]; then
            JAVA_DIR="$(dirname "$(dirname "$(readlink -f "$(command -v javac 2>/dev/null)")")")"
          fi
          [ -x "$JAVA_DIR/bin/java" ] || JAVA_DIR=/usr/lib/jvm/java-17-openjdk-amd64
          echo "JAVA_DIR النهائي: $JAVA_DIR" 
          DEBUG_KS="/root/debug.keystore"
          [ -f "$DEBUG_KS" ] || DEBUG_KS="$(find / -maxdepth 4 -name 'debug.keystore' 2>/dev/null | head -1)"
          FOUND="$(find / -maxdepth 5 -name 'editor_settings-4.3.tres' 2>/dev/null | head -1)"
          [ -n "$FOUND" ] && cp -n "$FOUND" ~/.config/godot/editor_settings-4.3.tres 2>/dev/null
          SET="$HOME/.config/godot/editor_settings-4.3.tres"
          # نكتب الملف أيضًا باسمين محتملين يقرأهما Godot حسب الإصدار
          cp -n "$SET" "$HOME/.config/godot/editor_settings-4.3.tres" 2>/dev/null || true
          mkdir -p "$HOME/.config/godot"
          if [ ! -f "$SET" ]; then
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SET"
          fi
          add_setting() {
            grep -q "^$1" "$SET" || echo "$1 = $2" >> "$SET"
          }
          add_setting export/android/java_sdk_path "\"$JAVA_DIR\""
          add_setting export/android/android_sdk_path "\"/usr/lib/android-sdk\""
          [ -f "$DEBUG_KS" ] && add_setting export/android/debug_keystore "\"$DEBUG_KS\""
          add_setting export/android/debug_keystore_user "\"androiddebugkey\""
          add_setting export/android/debug_keystore_pass "\"android\""
          add_setting export/android/force_system_user "false"
          add_setting export/android/timestamping_authority_url "\"\""
          add_setting export/android/shutdown_adb_on_exit "true"
          {
            echo "=== إعدادات المحرّر ($SET) ==="
            cat "$SET"
            echo "=== جافا: $JAVA_DIR | مفتاح التصحيح: $DEBUG_KS | إعدادات في الصورة: $FOUND ==="
            echo "=== java -version ==="
            java -version 2>&1 | head -2
          } >> "$BUILD_LOG"
          timeout 300 godot --headless --path project --editor --quit >> "$BUILD_LOG" 2>&1
          {
            echo "=== الملفات الفعلية بعد تشغيل Godot ==="
            find / -name "editor_settings-4.3.tres" 2>/dev/null | head -4
            grep -E "java_sdk_path|android_sdk_path|debug_keystore" "$SET" 2>/dev/null | head -6
          } >> "$BUILD_LOG"
          tail -10 "$SET"
          true

      - name: تأمين قوالب التصدير (٤٫٣)
        continue-on-error: true
        run: |
          set +e
          DEST="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$HOME/.local/share/godot"
          # صورة godot-ci تضع القوالب في /root لأن بناءها كان بـ HOME=/root،
          # لكن تشغيل Actions يجعل HOME=/github/home — لذلك نربط المجلد.
          if [ -d /root/.local/share/godot/export_templates ]; then
            ln -sfn /root/.local/share/godot/export_templates "$HOME/.local/share/godot/export_templates"
            cp -rn /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/" 2>/dev/null
          fi
          mkdir -p "$DEST"
          if [ ! -f "$DEST/android_debug.apk" ]; then
            echo "--- القوالب غير موجودة — ننزّلها ---" | tee -a "$BUILD_LOG"
            curl -sSL -w "http=%{http_code} bytes=%{size_download}" -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" 2>&1 | tee -a "$BUILD_LOG"
            rm -rf /tmp/tpl && mkdir -p /tmp/tpl && unzip -oq /tmp/templates.tpz -d /tmp/tpl
            cp -rf /tmp/tpl/templates/. "$DEST/" 2>/dev/null
          fi
          FOUND="$(find / -maxdepth 7 -name 'android_debug.apk' -not -path '*/proc/*' 2>/dev/null | head -3 | tr '\n' ' ')"
          if [ -f "$DEST/android_debug.apk" ]; then
            echo "::notice title=TEMPLATES-OK::قوالب أندرويد جاهزة في $DEST"
          else
            echo "::error title=TEMPLATES-MISSING::الملف المطلوب: $DEST/android_debug.apk | موجود في: $FOUND | محتوى المجلد: $(ls -1 "$DEST" 2>/dev/null | tr '\n' ' ') | جذر القوالب: $(ls -1 /root/.local/share/godot/export_templates 2>/dev/null | tr '\n' ' ')"
          fi
          true

      - name: تجهيز أدوات أندرويد (منصّة ٣٥ وأدوات البناء)
        continue-on-error: true
        run: |
          set +e
          SDKM="$(command -v sdkmanager)"
          [ -z "$SDKM" ] && SDKM="$(ls -1 /usr/lib/android-sdk/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager=$SDKM" | tee -a "$BUILD_LOG"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --sdk_root=/usr/lib/android-sdk --licenses >/dev/null 2>&1
            yes | "$SDKM" --sdk_root=/usr/lib/android-sdk "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>&1 | tail -6 | tee -a "$BUILD_LOG"
          fi
          PL="$(ls -1 /usr/lib/android-sdk/platforms 2>/dev/null | tr '\n' ' ')"
          BT="$(ls -1 /usr/lib/android-sdk/build-tools 2>/dev/null | tr '\n' ' ')"
          echo "platforms=$PL" | tee -a "$BUILD_LOG"
          echo "build-tools=$BT" | tee -a "$BUILD_LOG"
          if [ -d /usr/lib/android-sdk/platforms/android-35 ]; then
            echo "::notice title=SDK-OK::منصّة ٣٥ جاهزة | أدوات البناء: $BT"
          else
            echo "::warning title=SDK-35-MISSING::المنصّات المتاحة: $PL | أدوات البناء: $BT"
          fi
          true

      - name: استيراد المشروع (بناء ذاكرة الأصول)
        continue-on-error: true
        run: |
          set +e
          # --import وحده يكفي: يبدأ المحرّر ويستورد كل شيء ثم يخرج بنفسه.
          # (إضافة --quit كانت تُنهيه قبل انتهاء الاستيراد — درس من البناء الفعلي)
          timeout 1800 godot --headless --path project --import 2>&1 | tee -a "$BUILD_LOG"
          echo "import_exit=$?" | tee -a "$BUILD_LOG"
          IMP=$(ls project/.godot/imported 2>/dev/null | wc -l)
          FONTS=$(ls project/.godot/imported 2>/dev/null | grep -c "cairo_400")
          CACHE="project/.godot/global_script_class_cache.cfg"
          CLASSES=$(grep -c "GameWorld" "$CACHE" 2>/dev/null || echo 0)
          echo "::notice title=IMPORT::ملفات مستوردة=$IMP | خطوط=$FONTS | GameWorld في السجل=$CLASSES"
          echo "imported=$IMP fonts=$FONTS classes=$CLASSES" | tee -a "$BUILD_LOG"
          true

      - name: تثبيت قالب بناء أندرويد (Gradle)
        continue-on-error: true
        run: |
          set +e
          DEST="$HOME/.local/share/godot/export_templates/4.3.stable"
          # --quit ضرورية: بدونها يبقى Godot يعمل بلا نهاية بعد التثبيت
          timeout 900 godot --headless --path project --install-android-build-template --quit 2>&1 | tee -a "$BUILD_LOG"
          echo "install_exit=$?" | tee -a "$BUILD_LOG"
          echo "قالب بعد أمر Godot: $(ls project/android/build/build.gradle 2>/dev/null || echo 'مفقود')" | tee -a "$BUILD_LOG"
          # احتياطي مضمون: نستخرج قالب البناء بأنفسنا من android_source.zip
          # (هذا بالضبط ما يفعله محرّر Godot عند «Install Android Build Template»)
          if [ ! -f project/android/build/build.gradle ]; then
            echo "--- استخراج القالب يدويًا من android_source.zip ---" | tee -a "$BUILD_LOG"
            ls -1 "$DEST" 2>/dev/null | grep -i android | tee -a "$BUILD_LOG"
            if [ ! -f "$DEST/android_source.zip" ]; then
              echo "--- android_source.zip غير موجود — ننزّل القوالب كاملة ---" | tee -a "$BUILD_LOG"
              curl -sSL -w "http=%{http_code} bytes=%{size_download}" -o /tmp/templates.tpz \
                "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" 2>&1 | tee -a "$BUILD_LOG"
              rm -rf /tmp/tpl && mkdir -p /tmp/tpl && unzip -oq /tmp/templates.tpz -d /tmp/tpl
              cp -rf /tmp/tpl/templates/. "$DEST/" 2>/dev/null
            fi
            mkdir -p project/android/build
            unzip -oq "$DEST/android_source.zip" -d project/android/build 2>&1 | tail -3 | tee -a "$BUILD_LOG"
            touch project/android/.gdignore     # حتى لا يستوردها Godot كمشروع فرعي
          fi
          echo "قالب البناء النهائي: $(ls project/android/build/build.gradle 2>/dev/null || echo 'مفقود')" | tee -a "$BUILD_LOG"
          ls -1 project/android/build 2>/dev/null | head -12 | tee -a "$BUILD_LOG"
          if [ -f project/android/build/build.gradle ]; then
            echo "::notice title=TEMPLATE-OK::قالب بناء أندرويد جاهز في project/android/build"
          else
            echo "::error title=TEMPLATE-MISSING::لم يُثبّت قالب بناء أندرويد"
          fi
          true

      - name: توليد مفتاح توقيع الإصدار وإدراجه في الإعدادات
        continue-on-error: true
        run: |
          set +e
          KEYTOOL="$(command -v keytool)"
          [ -z "$KEYTOOL" ] && KEYTOOL="$(ls -1 /usr/lib/jvm/*/bin/keytool 2>/dev/null | head -1)"
          if [ -n "$KEYTOOL" ]; then
            "$KEYTOOL" -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/release.keystore" \
              -alias m11 -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass m11localwar -keypass m11localwar \
              -dname "CN=M11 Local War, OU=Games, O=M11-Developer, L=Cairo, C=EG" 2>&1 | tee -a "$BUILD_LOG"
          else
            echo "NO KEYTOOL — نحاول مفتاح الصورة /root/debug.keystore" | tee -a "$BUILD_LOG"
          fi
          DEBUG_KS="/root/debug.keystore"
          [ -f "$DEBUG_KS" ] || DEBUG_KS="$(find / -maxdepth 4 -name 'debug.keystore' 2>/dev/null | head -1)"
          REL_KS="$GITHUB_WORKSPACE/release.keystore"
          [ -f "$REL_KS" ] || REL_KS="$DEBUG_KS"
          [ -n "$REL_KS" ] && bash tools/patch_presets.sh "$REL_KS" m11 m11localwar \
            project/export_presets.cfg "$DEBUG_KS" androiddebugkey android 2>&1 | tee -a "$BUILD_LOG"
          echo "--- أسطر المفتاح في الإعدادات ---" | tee -a "$BUILD_LOG"
          grep -n "keystore/" project/export_presets.cfg | tee -a "$BUILD_LOG"

      - name: تصدير نسخة التصحيح (APK يُثبّت مباشرة)
        continue-on-error: true
        run: |
          set +e
          mkdir -p build
          echo "===== EXPORT-DEBUG1 START =====" >> "$BUILD_LOG"
          timeout 2400 godot --headless --verbose --path project --export-debug "Android APK" "$GITHUB_WORKSPACE/build/M11-debug.apk" 2>&1 | tee -a "$BUILD_LOG"
          echo "debug_export_exit=$?" | tee -a "$BUILD_LOG"
          echo "===== EXPORT-DEBUG1 END =====" >> "$BUILD_LOG"
          if [ ! -s build/M11-debug.apk ]; then
            echo "::warning::فشل مسار Gradle — نعيد بقالب التصدير المباشر (بلا Gradle)" | tee -a "$BUILD_LOG"
            sed -i 's|gradle_build/use_gradle_build=true|gradle_build/use_gradle_build=false|g' project/export_presets.cfg
            echo "===== EXPORT-DEBUG2 START =====" >> "$BUILD_LOG"
            timeout 2400 godot --headless --verbose --path project --export-debug "Android APK" "$GITHUB_WORKSPACE/build/M11-debug.apk" 2>&1 | tee -a "$BUILD_LOG"
            echo "debug_export_exit2=$?" | tee -a "$BUILD_LOG"
            echo "===== EXPORT-DEBUG2 END =====" >> "$BUILD_LOG"
          fi
          ls -la build | tee -a "$BUILD_LOG"

      - name: تصدير نسخة الإصدار (APK + AAB)
        continue-on-error: true
        run: |
          set +e
          # نعيد تمكين Gradle (خطوة التصحيح قد تكون عطّلته في مسار الاحتياط)
          sed -i 's|gradle_build/use_gradle_build=false|gradle_build/use_gradle_build=true|g' project/export_presets.cfg
          echo "===== EXPORT-RELEASE START =====" >> "$BUILD_LOG"
          timeout 2400 godot --headless --verbose --path project --export-release "Android APK" "$GITHUB_WORKSPACE/build/M11-release.apk" 2>&1 | tee -a "$BUILD_LOG"
          echo "release_apk_exit=$?" | tee -a "$BUILD_LOG"
          echo "===== EXPORT-RELEASE END =====" >> "$BUILD_LOG"
          timeout 2400 godot --headless --verbose --path project --export-release "Android AAB" "$GITHUB_WORKSPACE/build/M11-release.aab" 2>&1 | tee -a "$BUILD_LOG"
          echo "release_aab_exit=$?" | tee -a "$BUILD_LOG"
          ls -la build | tee -a "$BUILD_LOG"

      - name: التحقق من الملفات الناتجة
        continue-on-error: true
        run: |
          set +e
          for f in build/M11-debug.apk build/M11-release.apk build/M11-release.aab; do
            if [ -s "$f" ]; then echo "✔ $f — $(du -h "$f" | cut -f1)" | tee -a "$BUILD_LOG";
            else echo "✘ مفقود: $f" | tee -a "$BUILD_LOG"; fi
          done
          if command -v python3 >/dev/null 2>&1; then
            for f in build/M11-debug.apk build/M11-release.apk; do
              [ -s "$f" ] && python3 tools/check_apk.py "$f" 2>&1 | tee -a "$BUILD_LOG"
            done
          else
            for f in build/M11-debug.apk build/M11-release.apk; do
              [ -s "$f" ] && python3 -c "pass" 2>/dev/null
            done
            for f in build/M11-debug.apk build/M11-release.apk; do
              if [ -s "$f" ]; then
                echo "--- فحص بسيط لـ $f (بلا بايثون) ---" | tee -a "$BUILD_LOG"
                unzip -l "$f" 2>/dev/null | grep -E "lib/|assets/" | head -5 | tee -a "$BUILD_LOG"
                unzip -p "$f" AndroidManifest.xml 2>/dev/null | tr -d '\0' | grep -c "permission.INTERNET" | tee -a "$BUILD_LOG"
              fi
            done
          fi
          echo ok > /tmp/m11-status
          true

      - name: الحصاد النهائي (هل أُنتج ملف قابل للتثبيت؟)
        id: gate
        run: |
          set -e
          ok=0
          for f in build/M11-debug.apk build/M11-release.apk; do
            if [ -s "$f" ]; then echo "✔ $f — $(du -h "$f" | cut -f1)"; ok=1; fi
          done
          if [ "$ok" = "0" ]; then
            echo "::error::لم يُنتج أي APK — راجع قناة التشخيص (Issue)"
            exit 1
          fi

      - name: رفع الملفات كأرتيفاكت
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M11-android
          if-no-files-found: warn
          path: |
            build/*.apk
            build/*.aab
            docs/RELEASE_NOTES_AR.md
            /tmp/m11-build.log

      - name: إنشاء Release (إن طُلب)
        if: success() && (startsWith(github.ref, 'refs/tags/v') || inputs.makerelease == 'yes')
        uses: softprops/action-gh-release@v2
        with:
          name: "ميكا ١١ — الإصدار ١٫٠ (لعب محلي عبر الشبكة)"
          body_path: docs/RELEASE_NOTES_AR.md
          generate_release_notes: false
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            build/M11-debug.apk
            build/M11-release.apk
            build/M11-release.aab

      # ---------- بثّ أخطاء السجل كتعليقات يقرأها المطوّر عبر واجهة GitHub ----------
      - name: تشخيص فشل التصدير (تعليقات)
        if: always()
        run: |
          bash tools/diag_log.sh "$BUILD_LOG"
          bash tools/emit_annotations.sh /tmp/m11-diag.txt "." error 9 0 head

      # ---------- قناة التشخيص: تُنشر دائمًا لأن سجلات Actions قد تكون محجوبة ----------
      - name: نشر سجل البناء في قناة التشخيص
        if: always()
        run: |
          set +e
          NUM="$(cat /tmp/issue_number 2>/dev/null)"
          STATUS="$(cat /tmp/m11-status 2>/dev/null || echo 'stopped-early')"
          HEAD="$STATUS run=$GITHUB_RUN_ID ref=$GITHUB_REF_NAME"
          B64="$(tail -c 30000 "$BUILD_LOG" 2>/dev/null | base64 -w0)"
          if [ -z "$NUM" ]; then
            printf '{"title":"M11 build %s","body":"### %s\\n```\\n%s\\n```"}' "$GITHUB_RUN_ID" "$HEAD" "$B64" > /tmp/diag.json
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "User-Agent: m11-ci" --data @/tmp/diag.json \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" | head -c 200
          else
            printf '{"body":"### %s\\n```\\n%s\\n```"}' "$HEAD" "$B64" > /tmp/diag.json
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "User-Agent: m11-ci" --data @/tmp/diag.json \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$NUM/comments" | head -c 200
          fi
          echo
